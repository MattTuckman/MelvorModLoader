title: Melvor Idle 2 Modding Wiki
description: >-
  Install mods for Melvor Idle 2, and write your own. The guide to Melvor Mod Loader:
  first mod in ten minutes, the full API, how the game works inside, tested recipes.
url: https://falorfrozen-cmd.github.io
baseurl: /MelvorModLoader

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

color_scheme: melvor
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 4
  preview_words_after: 8
  button: true

heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

aux_links:
  "Nexus Mods": "https://www.nexusmods.com/melvoridle2/mods/2"
  "Discord": "https://discord.gg/q6aexZZSAf"
  "GitHub": "https://github.com/falorfrozen-cmd/MelvorModLoader"
aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: "Suggest a change to this page"
gh_edit_repository: "https://github.com/falorfrozen-cmd/MelvorModLoader"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "edit"

footer_content: >-
  Community-made and unofficial. Not affiliated with Games by Malcs or Jagex.
  Text under the MIT license, like the code.

callouts:
  tip:
    title: Tip
    color: green
  note:
    title: Note
    color: blue
  warning:
    title: Careful
    color: yellow
  danger:
    title: Never
    color: red

exclude:
  - README.md
